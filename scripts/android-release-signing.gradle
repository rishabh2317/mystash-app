// Applied only by the cloud release workflow; credentials remain in runner secrets.
def android = project.extensions.getByName('android')
    def required = ['ANDROID_RELEASE_KEYSTORE_PATH', 'ANDROID_RELEASE_STORE_PASSWORD',
                    'ANDROID_RELEASE_KEY_ALIAS', 'ANDROID_RELEASE_KEY_PASSWORD']
    required.each { name ->
        if (!System.getenv(name)) throw new GradleException("Missing release signing setting: ${name}")
    }
    def signing = android.signingConfigs.create('mystashCloudRelease')
    signing.storeFile = new File(System.getenv('ANDROID_RELEASE_KEYSTORE_PATH'))
    signing.storePassword = System.getenv('ANDROID_RELEASE_STORE_PASSWORD')
    signing.keyAlias = System.getenv('ANDROID_RELEASE_KEY_ALIAS')
    signing.keyPassword = System.getenv('ANDROID_RELEASE_KEY_PASSWORD')
    android.buildTypes.getByName('release').signingConfig = signing
