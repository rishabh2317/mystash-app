apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
group = 'expo.modules.mystashshare'
version = '1.0.0'
android {
  namespace 'expo.modules.mystashshare'
  defaultConfig { versionCode 1; versionName '1.0.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
  sourceSets { androidTest.assets.srcDir '../fixtures' }
}
dependencies {
  implementation 'androidx.work:work-runtime:2.10.5'
  testImplementation 'junit:junit:4.13.2'
  androidTestImplementation 'androidx.test:runner:1.6.2'
  androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
