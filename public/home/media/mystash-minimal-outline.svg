<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="8 7 48 48" role="img" aria-label="Mystash minimal folded bookmark outline">
  <title>Mystash — Minimal Fold Outline</title>
  <desc>A centered, single-weight bookmark outline with a detached folded top-right corner and mirrored V notch. Its transparent strokes inherit currentColor.</desc>
  <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- V notch and side stems mirror about x=32. The upper-right fold is intentionally asymmetrical. -->
    <path d="M 15.2 11.8 H 37.6 V 22.8 Q 37.6 25.5 40.6 25.5 H 49.4 V 51.6 L 32 40.4 L 14.6 51.6 V 12.4 Q 14.6 11.8 15.2 11.8 Z"/>
    <path d="M 42.7 12.2 Q 42.7 11.7 43.3 12.1 L 49.1 19.3 Q 49.7 20.1 48.6 20.1 H 42.7 Z"/>
  </g>
</svg>
